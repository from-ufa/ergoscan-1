# Drop-in — do not enable until the operator starts DEX history.
#   mkdir -p /etc/systemd/system/ergoscan-defi-projector.service.d
#   cp deploy/systemd/ergoscan-defi-projector.history.conf \
#      /etc/systemd/system/ergoscan-defi-projector.service.d/history.conf
# Then set defi.worker_state scan_height = 451999 and restart the unit.
[Service]
Environment=DEFI_HISTORY=1
Environment=DEFI_FROM_HEIGHT=452000
Environment=DEFI_INDEXER_PAUSE_LAG=2
Environment=BATCH_HEIGHTS=40
Environment=TRAIL_RESCAN=16
Environment=DETECT_TIMEOUT_MS=8000
Environment=RANKS_HISTORY_MS=1800000
