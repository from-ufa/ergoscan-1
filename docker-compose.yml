services:
  gateway:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build -w @ergoscan/shared && npm run start -w @ergoscan/gateway"
    environment:
      PORT: 4400
      MOCK: ${MOCK:-1}
      ERGO_NODE_URL: ${ERGO_NODE_URL:-http://host.docker.internal:9053}
      NETWORK: ${NETWORK:-mainnet}
    ports:
      - "4400:4400"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build -w @ergoscan/web && npm run start -w @ergoscan/web"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4400
      NEXT_PUBLIC_WS_URL: ws://localhost:4400/v1/stream
    ports:
      - "4410:4410"
    depends_on:
      - gateway
